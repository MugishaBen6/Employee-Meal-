spring:
  datasource:
    url: jdbc:h2:mem:employee_meal_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: postgres
    password: postgres
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # V7 creates PostgreSQL functional indexes (e.g. LOWER(username)) that H2
    # cannot parse. V7 and V8 contain indexes only (no tables/columns), so the
    # in-memory H2 schema is still complete and Hibernate "validate" passes.
    # Production (PostgreSQL) is unaffected: this file is only loaded with the
    # "h2" profile. Raise this target if a future migration changes the schema.
    target: "6"
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  frontend:
    url: http://127.0.0.1:5173
